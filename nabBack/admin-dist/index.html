<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Globex CFO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    
    #admin-iframe {
      width: 100%;
      height: 100vh;
      border: none;
      display: block;
    }
    
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: white;
      font-size: 1.2rem;
    }
    
    .loader {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 1rem;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="loader"></div>
    Loading Admin Dashboard...
  </div>
  <iframe id="admin-iframe" style="display: none;"></iframe>
  
  <script>
    // Load the main app in iframe pointing to /Admin route
    const iframe = document.getElementById('admin-iframe');
    const loading = document.getElementById('loading');
    
    // Point to main server's /Admin route
    const mainServerUrl = window.location.protocol + '//' + window.location.hostname + ':3000/Admin';
    
    iframe.onload = function() {
      loading.style.display = 'none';
      iframe.style.display = 'block';
    };
    
    iframe.src = mainServerUrl;
    
    // Fallback timeout
    setTimeout(() => {
      if (loading.style.display !== 'none') {
        loading.innerHTML = '<div class="loader"></div>Failed to load. Please check if main server is running on port 3000.';
      }
    }, 10000);
  </script>
</body>
</html>
